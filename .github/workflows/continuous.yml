name: Continuous Workflow

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual triggering
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: SHAH-MWOL
  uses: Ottapettavan/SHAH-MWOL@Nude.js
      
       - name: SHAH-MWOL
  uses: Ottapettavan/SHAH-MWOL@Nude.js
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Re-trigger workflow
        if: ${{ success() }}  # Only re-trigger if previous steps succeeded
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/continuous.yml/dispatches \
            -d '{"ref":"main"}'
 
